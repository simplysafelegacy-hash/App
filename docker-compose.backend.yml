# Backend-only local stack.
#
# Use this when running the frontend with Vite on your host:
#
#   docker compose --env-file .env.dev -f docker-compose.backend.yml up --build
#   VITE_DEMO_MODE=false npm run dev
#
# Vite proxies /api to http://localhost:8080 by default.

name: simplysafelegacy-backend

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simplysafelegacy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simplysafelegacy_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-simplysafelegacy}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - backend_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-simplysafelegacy} -d ${POSTGRES_DB:-simplysafelegacy}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-simplysafelegacy}:${POSTGRES_PASSWORD:-simplysafelegacy_dev_password}@postgres:5432/${POSTGRES_DB:-simplysafelegacy}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-of-at-least-32-chars}
      JWT_EXPIRY: ${JWT_EXPIRY:-168h}
      ALLOWED_ORIGINS: ${BACKEND_LOCAL_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
      PUBLIC_APP_URL: ${BACKEND_LOCAL_PUBLIC_APP_URL:-http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_PRICE_INDIVIDUAL: ${STRIPE_PRICE_INDIVIDUAL}
      STRIPE_PRICE_FAMILY: ${STRIPE_PRICE_FAMILY}
      STRIPE_PRICE_SAFEKEEPING: ${STRIPE_PRICE_SAFEKEEPING}
      STRIPE_TRIAL_DAYS: ${STRIPE_TRIAL_DAYS:-14}
      GCS_BUCKET: ${GCS_BUCKET:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      SUPPORT_EMAIL_TO: ${SUPPORT_EMAIL_TO:-simplysafelegacy@gmail.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

volumes:
  backend_pgdata:
