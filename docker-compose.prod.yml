# docker-compose.prod.yml — production overlay (app VM).
#
# Layered on top of docker-compose.yml by the deploy script:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Production runs on two VMs:
#
#   app VM (this file)              database VM
#   ┌──────────────────────┐        ┌──────────────────┐
#   │ caddy   :80 :443     │        │ postgres :5432   │
#   │ frontend             │        │ (already set up, │
#   │ backend ─────────────┼───────▶│  not managed by  │
#   └──────────────────────┘        │  this repo)      │
#                                   └──────────────────┘
#
# What it changes versus the base file:
#   - Adds Caddy on :80 / :443 with auto-HTTPS (needs a real domain in DNS).
#   - Removes the direct port mappings on backend/frontend so only Caddy is
#     reachable from the internet.
#   - Runs NO postgres container. The base file keeps postgres behind the
#     "localdb" compose profile; production never enables that profile, so
#     the service is not created here at all. The backend talks to
#     POSTGRES_HOST on the database VM instead — see .env.prod.
#
# Schema migrations are embedded in the Go binary and applied by the backend
# at boot against the remote database, gated by RUN_MIGRATIONS (default
# true). See deploy/README-prod.md.

services:
  backend:
    ports: []
    environment:
      APP_ENV: production

  frontend:
    ports: []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
